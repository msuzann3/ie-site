<style>
  :root {
    --midnight:#0D1B35; --midnight-2:#152849;
    --emerald:#0B8F68; --emerald-mid:#0D7A59; --emerald-light:#E0F5EE;
    --azure:#60A5FA; --periwinkle:#93C5FD; --sky:#EFF6FF; --silver:#F8FAFC; --white:#fff;
    --text-mid:#4B5A6E; --border:rgba(13,27,53,.09); --border-2:rgba(13,27,53,.14);
    --font-display:'Syne',ui-sans-serif,system-ui,sans-serif;
    --font-body:'Outfit',ui-sans-serif,system-ui,sans-serif;
  }
  * { box-sizing:border-box; }
  body {
    margin:0; font-family:var(--font-body); font-weight:300; line-height:1.7;
    color:var(--midnight); background:var(--silver);
    -webkit-font-smoothing:antialiased;
  }
  .wrap { max-width:900px; margin:0 auto; padding:36px 22px 56px; }

  h1,h2,h3 { font-family:var(--font-display); color:var(--midnight); margin:0; }
  h1 { font-size:clamp(30px,4.4vw,44px); font-weight:400; letter-spacing:-1px; line-height:1.1; }
  h2 { font-size:26px; font-weight:500; letter-spacing:-.5px; }
  h3 { font-size:18px; font-weight:500; }
  p { color:var(--text-mid); margin:0; }
  a { color:var(--emerald); text-decoration:none; }
  a:hover { color:var(--emerald-mid); text-decoration:underline; }
  .plus { color:var(--emerald); }

  .eyebrow { font-family:var(--font-body); font-size:11px; font-weight:600; letter-spacing:1.5px; text-transform:uppercase; color:var(--emerald); }

  .header { text-align:center; margin-bottom:30px; }
  .header .mark { margin:0 auto 18px; display:block; height:46px; }
  .subtitle { color:var(--text-mid); font-size:1.02rem; margin-top:10px; }

  .card { background:var(--white); border:.5px solid var(--border); border-radius:16px; box-shadow:0 14px 30px rgba(13,27,53,.06); padding:30px; }
  .lead { text-align:center; max-width:620px; margin:14px auto 24px; }

  .grid { display:grid; grid-template-columns:repeat(3,1fr); gap:14px; }
  @media (max-width:720px){ .grid { grid-template-columns:1fr 1fr; } }
  @media (max-width:480px){ .grid { grid-template-columns:1fr; } }

  .dim-card { background:var(--silver); border:.5px solid var(--border); border-radius:12px; padding:15px; border-left:4px solid var(--azure); }
  .dim-head { display:flex; align-items:center; gap:9px; margin-bottom:7px; }
  .badge-i { width:32px; height:32px; border-radius:9px; display:flex; align-items:center; justify-content:center; flex:0 0 auto; }
  .badge-i svg { width:18px; height:18px; }
  .dim-card h3 { font-size:.92rem; }
  .dim-card p { font-size:.78rem; line-height:1.5; }
  .success { background:var(--emerald-light); border-left-color:var(--emerald); display:flex; flex-direction:column; align-items:center; justify-content:center; text-align:center; }
  .success h3 { color:var(--emerald-mid); } .success p { color:var(--emerald-mid); }

  .btn { font-family:var(--font-body); border:none; cursor:pointer; font-weight:600; border-radius:24px; transition:.15s; font-size:.95rem; display:inline-flex; align-items:center; gap:8px; }
  .btn-primary { background:var(--midnight); color:#fff; padding:13px 28px; }
  .btn-primary:hover { background:var(--midnight-2); }
  .btn-ghost { background:#fff; color:var(--midnight); border:1px solid var(--border-2); padding:12px 22px; }
  .btn-ghost:hover { background:var(--silver); }
  .btn-cta { background:var(--emerald); color:#fff; padding:14px 30px; border-radius:32px; }
  .btn-cta:hover { background:var(--emerald-mid); color:#fff; text-decoration:none; }
  .center { text-align:center; }

  .topbar { display:flex; justify-content:space-between; align-items:center; margin-bottom:12px; gap:12px; }
  .topbar .ttl { display:flex; align-items:center; gap:12px; }
  .topbar .ttl img { height:26px; }
  .topbar h1 { font-size:1.3rem; letter-spacing:-.4px; }
  .pageno { font-size:11px; font-weight:600; letter-spacing:1px; text-transform:uppercase; color:var(--text-mid); white-space:nowrap; }
  .progress { width:100%; height:8px; background:#e8edf5; border-radius:99px; overflow:hidden; margin-bottom:22px; }
  .progress > div { height:100%; background:var(--emerald); border-radius:99px; transition:width .35s; }

  .dim-title { display:flex; align-items:center; gap:14px; margin-bottom:20px; }
  .dim-title .badge-i { width:50px; height:50px; border-radius:13px; }
  .dim-title .badge-i svg { width:28px; height:28px; }
  .dim-title p { margin-top:2px; }

  .q { border-bottom:.5px solid var(--border); padding:18px 0; }
  .q:last-child { border-bottom:none; }
  .q p { color:var(--midnight); font-weight:500; margin-bottom:14px; }
  .scale { display:flex; align-items:center; justify-content:space-between; gap:8px; flex-wrap:wrap; }
  .scale .lbl { font-size:.76rem; color:var(--text-mid); }
  .dots { display:flex; gap:8px; }
  .dot { width:42px; height:42px; border-radius:99px; border:1.5px solid var(--border-2); background:#fff; color:var(--text-mid); font-family:var(--font-body); font-weight:600; cursor:pointer; transition:.12s; }
  .dot:hover { border-color:var(--azure); }
  .dot.sel { background:var(--midnight); border-color:var(--midnight); color:#fff; }
  .nav { display:flex; justify-content:space-between; margin-top:26px; }

  .score-big { font-family:var(--font-display); font-size:4.2rem; font-weight:500; letter-spacing:-2px; margin:6px 0 2px; }
  .res-card { background:#fff; border:.5px solid var(--border); border-radius:16px; box-shadow:0 14px 30px rgba(13,27,53,.06); padding:22px; border-left:4px solid var(--azure); }
  .res-card h3 { display:flex; align-items:center; gap:10px; font-size:1rem; margin-bottom:14px; }
  .bar { width:100%; height:12px; background:#e8edf5; border-radius:99px; overflow:hidden; }
  .bar > div { height:100%; border-radius:99px; transition:width .5s; }
  .pill { background:var(--silver); border:.5px solid var(--border); border-radius:8px; padding:8px 10px; font-size:.8rem; color:var(--text-mid); margin-top:12px; }
  .legend { display:grid; grid-template-columns:repeat(3,1fr); gap:18px; text-align:center; }
  @media (max-width:480px){ .legend { grid-template-columns:1fr; } }
  .legend .n { font-family:var(--font-display); font-size:1.5rem; font-weight:500; }
  .legend .lbl { font-size:.82rem; color:var(--text-mid); }

  .cta { background:var(--emerald-light); border:.5px solid rgba(11,143,104,.25); border-radius:16px; padding:26px; margin-top:26px; text-align:center; }
  .cta h2 { margin-bottom:10px; }
  .cta .contact { font-size:.85rem; color:var(--text-mid); margin-top:12px; }

  .radar-wrap { display:flex; justify-content:center; margin:6px 0 22px; }

  .next-card { background:var(--midnight); border-left:4px solid var(--emerald); display:flex; flex-direction:column; justify-content:center; }
  .next-card h3 { color:#fff; margin-bottom:8px; }
  .next-card p { color:rgba(255,255,255,.6); font-size:.82rem; margin-bottom:14px; }

  .footer { text-align:center; font-size:.72rem; color:var(--text-mid); margin-top:26px; line-height:1.7; }
  .footer .fmark { height:30px; margin-bottom:12px; opacity:.95; }

  @media print {
    .btn, .no-print { display:none !important; }
    body { background:#fff; }
    .card, .res-card { box-shadow:none; break-inside:avoid; }
    .wrap { padding:8px 0; }
  }
  body, .card, .res-card, .bar > div, .badge-i, .next-card, .cta { -webkit-print-color-adjust:exact; print-color-adjust:exact; }
</style>
</head>

const TOTAL = dimensions.length;
const RESULTS = TOTAL + 1;
let currentPage = 0;
let responses = {};
let orgName = "";
let userName = "";
let userEmail = "";
let submitted = false;

function escAttr(s){ return String(s).replace(/&/g,'&amp;').replace(/"/g,'&quot;').replace(/</g,'&lt;').replace(/>/g,'&gt;'); }
function escHtml(s){ return escAttr(s); }
function dateStr(){ return new Date().toLocaleDateString(undefined,{year:'numeric',month:'long',day:'numeric'}); }

function colorFor(s){ return s>60?'#0B8F68': s>40?'#F59E0B':'#EF4444'; }
function dimScore(i){
  let vals=[]; for(let q=0;q<4;q++){ const r=responses[i+'-'+q]; if(r!==undefined) vals.push(r); }
  if(!vals.length) return 0;
  return Math.round((vals.reduce((a,b)=>a+b,0)/vals.length)*20);
}

function buildRadar(scores){
  const W=440,H=380,cx=W/2,cy=H/2+6,R=130,n=scores.length;
  const ang=i=>(-90+i*(360/n))*Math.PI/180;
  const pt=(i,r)=>[cx+r*Math.cos(ang(i)),cy+r*Math.sin(ang(i))];
  let grid='';
  [20,40,60,80,100].forEach(level=>{ let pts=[]; for(let i=0;i<n;i++){const[x,y]=pt(i,R*level/100);pts.push(x.toFixed(1)+','+y.toFixed(1));} grid+='<polygon points="'+pts.join(' ')+'" fill="none" stroke="rgba(13,27,53,.10)" stroke-width="1"/>'; });
  let axes=''; for(let i=0;i<n;i++){const[x,y]=pt(i,R);axes+='<line x1="'+cx+'" y1="'+cy+'" x2="'+x.toFixed(1)+'" y2="'+y.toFixed(1)+'" stroke="rgba(13,27,53,.10)" stroke-width="1"/>';}
  let dataPts=[]; for(let i=0;i<n;i++){const[x,y]=pt(i,R*scores[i]/100);dataPts.push(x.toFixed(1)+','+y.toFixed(1));}
  const overall=Math.round(scores.reduce((a,b)=>a+b,0)/n); const stroke=colorFor(overall);
  let verts=''; for(let i=0;i<n;i++){const[x,y]=pt(i,R*scores[i]/100);verts+='<circle cx="'+x.toFixed(1)+'" cy="'+y.toFixed(1)+'" r="4" fill="'+dimensions[i].color+'"/>';}
  let labels='';
  for(let i=0;i<n;i++){
    const[lx,ly]=pt(i,R+26); let anchor='middle'; if(lx<cx-6)anchor='end'; else if(lx>cx+6)anchor='start';
    labels+='<text x="'+lx.toFixed(1)+'" y="'+ly.toFixed(1)+'" text-anchor="'+anchor+'" font-family="Outfit,sans-serif" font-size="12" font-weight="600" fill="'+dimensions[i].color+'">'+dimensions[i].short+'</text>';
    const[vx,vy]=pt(i,R*scores[i]/100-14);
    labels+='<text x="'+vx.toFixed(1)+'" y="'+(vy+4).toFixed(1)+'" text-anchor="middle" font-family="Outfit,sans-serif" font-size="10.5" font-weight="600" fill="#0D1B35">'+scores[i]+'</text>';
  }
  return '<svg viewBox="0 0 '+W+' '+H+'" width="100%" style="max-width:440px">'+grid+axes+'<polygon points="'+dataPts.join(' ')+'" fill="'+stroke+'2e" stroke="'+stroke+'" stroke-width="2.5"/>'+verts+labels+'</svg>';
}

function render(){
  const app=document.getElementById('app');
  if(currentPage===0) app.innerHTML=welcomeHTML();
  else if(currentPage>=1&&currentPage<=TOTAL) app.innerHTML=dimensionHTML(currentPage-1);
  else app.innerHTML=resultsHTML();
  window.scrollTo(0,0);
}

function welcomeHTML(){
  let cards='';
  dimensions.forEach(d=>{
    cards+='<div class="dim-card" style="border-left-color:'+d.color+'"><div class="dim-head"><span class="badge-i" style="background:'+d.color+'1f">'+svgIcon(d.icon,d.color)+'</span><h3>'+d.name+'</h3></div><p>'+d.description+'</p></div>';
  });
  cards+='<div class="dim-card success"><span class="badge-i" style="background:#0B8F6820">'+svgIcon('check','#0B8F68')+'</span><h3>Success Requires</h3><p>High performance across ALL dimensions</p></div>';
  const inputStyle='width:100%;padding:11px 14px;border:1px solid var(--border-2);border-radius:10px;font-family:var(--font-body);font-size:15px;color:var(--midnight);outline:none';
  const labelStyle='display:block;font-size:11px;font-weight:600;letter-spacing:1.5px;text-transform:uppercase;color:var(--text-mid);margin-bottom:6px';
  return ''

    +   '<div class="eyebrow">Organizational AI Readiness</div>'

    +   '<p class="subtitle">Updated for 2026 — readiness for the age of AI agents</p>'
    + '</div>'

    +   '<h2 class="center">Assess your organization’s AI readiness</h2>'
    +   '<p class="lead">This assessment evaluates your organization across six critical dimensions of AI readiness. Each section contains 4 questions rated on a scale of 1–5.</p>'
    +   '<div class="grid">'+cards+'</div>'
    +   '<div class="center" style="margin-top:26px">'
    +     '<div style="max-width:340px;margin:0 auto 16px;text-align:left">'
    +       '<label style="'+labelStyle+'">Your name</label>'
    +       '<input id="nameInput" type="text" value="'+escAttr(userName)+'" oninput="userName=this.value" placeholder="Jane Smith" style="'+inputStyle+';margin-bottom:12px"/>'
    +       '<label style="'+labelStyle+'">Your email</label>'
    +       '<input id="emailInput" type="email" value="'+escAttr(userEmail)+'" oninput="userEmail=this.value" placeholder="jane@company.com" style="'+inputStyle+';margin-bottom:12px"/>'
    +       '<label style="'+labelStyle+'">Organization name (optional)</label>'
    +       '<input id="orgInput" type="text" value="'+escAttr(orgName)+'" oninput="orgName=this.value" placeholder="e.g., Acme Health" style="'+inputStyle+'"/>'
    +     '</div>'
    +     '<button class="btn btn-primary" onclick="startAssessment()">Start Assessment &rarr;</button>'
    +   '</div>'
    + '</div>'
    + footerHTML();
}

function dimensionHTML(i){
  const d=dimensions[i]; let qs='';
  d.questions.forEach((q,qi)=>{
    let dots=''; for(let v=1;v<=5;v++){ const sel=responses[i+'-'+qi]===v?' sel':''; dots+='<button class="dot'+sel+'" onclick="answer('+i+','+qi+','+v+')">'+v+'</button>'; }
    qs+='<div class="q"><p>'+q+'</p><div class="scale"><span class="lbl">Strongly Disagree</span><div class="dots">'+dots+'</div><span class="lbl">Strongly Agree</span></div></div>';
  });
  return ''
    + '<div class="topbar"><div class="ttl">'+BADGE.replace('width="64" height="64"','width="26" height="26"')+'<h1>AI Readiness Assessment</h1></div><span class="pageno">'+currentPage+' / '+TOTAL+'</span></div>'
    + '<div class="progress"><div style="width:'+((currentPage/TOTAL)*100)+'%"></div></div>'
    + '<div class="card">'
    +   '<div class="dim-title"><span class="badge-i" style="background:'+d.color+'1f">'+svgIcon(d.icon,d.color)+'</span><div><h2>'+d.name+'</h2><p>'+d.description+'</p></div></div>'
    +   qs
    +   '<div class="nav"><button class="btn btn-ghost" onclick="go('+(currentPage-1)+')">&larr; Previous</button><button class="btn btn-primary" onclick="go('+(currentPage+1)+')">'+(currentPage===TOTAL?'View Results':'Next')+' &rarr;</button></div>'
    + '</div>';
}

function resultsHTML(){
  const scores=dimensions.map((_,i)=>dimScore(i));
  const avg=Math.round(scores.reduce((a,b)=>a+b,0)/scores.length);
  let cards='';

    const s=scores[i],c=colorFor(s); const tag=s>60?'Strong performance':s>40?'Moderate readiness':'Needs attention';
    cards+='<div class="res-card" style="border-left-color:'+d.color+'"><h3><span class="badge-i" style="background:'+d.color+'1f">'+svgIcon(d.icon,d.color)+'</span>'+d.name+'</h3>'
      +'<div style="display:flex;justify-content:space-between;font-size:.82rem;color:var(--text-mid);margin-bottom:4px"><span>Your score</span><span style="font-weight:600;color:var(--midnight)">'+s+'%</span></div>'
      +'<div class="bar"><div style="width:'+s+'%;background:'+c+'"></div></div><div class="pill">'+tag+'</div></div>';
  });
  cards+='<div class="res-card next-card"><h3>Next steps</h3><p>Focus on your lowest-scoring dimensions first for maximum impact.</p><button class="btn btn-ghost" style="justify-content:center" onclick="reset()">&#8635; Clear &amp; Restart</button></div>';
  return ''
    + '<div class="header" style="margin-bottom:18px">'+WORDMARK
    +   '<div class="eyebrow" style="margin-top:14px">Your Results</div>'
    +   (userName ? '<p style="margin-top:6px;font-size:.95rem;color:var(--midnight);font-weight:500">Prepared for '+escHtml(userName)+(orgName?' &middot; '+escHtml(orgName):'')+'</p>' : (orgName ? '<p style="margin-top:6px;font-size:.95rem;color:var(--midnight);font-weight:500">Prepared for '+escHtml(orgName)+'</p>' : ''))
    +   '<p class="subtitle" style="margin-top:'+(userName||orgName?'2px':'8px')+';font-size:.85rem">'+dateStr()+'</p>'
    +   '<div class="score-big" style="color:'+colorFor(avg)+'">'+avg+'%</div>'
    +   '<p class="subtitle" style="margin-top:0">Overall AI Readiness Score</p>'
    +   '<div class="no-print" style="margin-top:16px"><button class="btn btn-primary" onclick="downloadPDF(this)">Download your results (PDF) &darr;</button></div></div>'
    + '<div class="card" style="margin-bottom:24px"><h2 class="center">Your readiness profile</h2><div class="radar-wrap">'+buildRadar(scores)+'</div></div>'
    + '<div class="grid">'+cards+'</div>'
    + '<div class="card" style="margin-top:24px"><h2 class="center">Understanding your results</h2><div class="legend">'
    +   '<div><div class="n" style="color:#0B8F68">60%+</div><div class="lbl">Ready for AI transformation</div></div>'
    +   '<div><div class="n" style="color:#D97706">40–59%</div><div class="lbl">Building readiness</div></div>'
    +   '<div><div class="n" style="color:#DC2626">Under 40%</div><div class="lbl">Foundation needed</div></div>'
    + '</div></div>'
    + '<div class="cta"><h2>Ready to accelerate your AI journey?</h2>'
    +   '<p>To take a deeper dive into your AI readiness and change management approach, reach out to Michelle at <a href="https://www.innovate-elevate.ai" target="_blank" rel="noopener">Innovate+Elevate Strategies</a>.</p>'
    +   '<div style="margin-top:16px"><a class="btn btn-cta" href="https://go.innovate-elevate.ai/meetwithmichelle" target="_blank" rel="noopener">Book a call &rarr;</a> <button class="btn btn-ghost no-print" onclick="downloadPDF(this)">&#8595; Download PDF</button></div>'
    + '</div>'
    + footerHTML();
}

function footerHTML(){
  return '<div class="footer">'+BADGE.replace('width="64" height="64"','width="30" height="30" class="fmark"')+'<br>'
    + 'Framework based on the <a href="https://knowledge.wharton.upenn.edu/article/whats-your-companys-ai-readiness-quotient/" target="_blank" rel="noopener">AI Readiness Quotient (AI-RQ) by Scott A. Snyder</a>, Wharton School, '
    + 'with agentic-era updates informed by the <a href="https://ai.wharton.upenn.edu/" target="_blank" rel="noopener">Wharton AI &amp; Analytics Initiative</a> (<em>The Age of Co-Intelligence</em>, 2026).<br>'
    + 'Data Management, Enablement &amp; Adoption, and AI Governance questions &copy; 2026, '
    + '<a href="https://www.innovate-elevate.ai" target="_blank" rel="noopener">Innovate+Elevate Strategies, LLC</a></div>';
}

/* ---------- Formspree notification ---------- */
function startAssessment(){ go(1); }

function sendToFormspree(scores){
  const avg=Math.round(scores.reduce((a,b)=>a+b,0)/scores.length);
  fetch('https://formspree.io/f/mzdnynqn',{
    method:'POST',
    headers:{'Accept':'application/json','Content-Type':'application/json'},
    body:JSON.stringify({
      name: userName,
      email: userEmail,
      organization: orgName||'(not provided)',
      overall_score: avg+'%',
      scores: dimensions.map((d,i)=>d.name+': '+scores[i]+'%').join(', ')
    })
  }).catch(()=>{});
}

/* ---------- Branded PDF report ---------- */
function buildReportHTML(scores){
  const avg=Math.round(scores.reduce((a,b)=>a+b,0)/scores.length);
  const C='#0D1B35', MUTED='#4B5A6E', EM='#0B8F68';
  let rows='';
  dimensions.forEach((d,i)=>{
    const s=scores[i], c=colorFor(s); const tag=s>60?'Strong performance':s>40?'Moderate readiness':'Needs attention';

      +'<span style="display:inline-flex;align-items:center;justify-content:center;width:30px;height:30px;border-radius:8px;background:'+d.color+'1f;flex:0 0 auto">'+svgIcon(d.icon,d.color)+'</span>'
      +'<div style="flex:1 1 auto;min-width:0">'
        +'<div style="display:flex;justify-content:space-between;font-size:13px;font-weight:600;color:'+C+'"><span>'+d.name+'</span><span>'+s+'%</span></div>'
        +'<div style="width:100%;height:8px;background:#e8edf5;border-radius:99px;margin-top:5px;overflow:hidden"><div style="width:'+s+'%;height:8px;background:'+c+';border-radius:99px"></div></div>'
      +'</div>'
      +'<span style="font-size:11px;color:'+MUTED+';width:120px;text-align:right;flex:0 0 auto">'+tag+'</span>'
    +'</div>';
  });
  return ''
    + '<div style="font-family:Outfit,sans-serif;color:'+C+';padding:28px 34px 24px;background:#fff">'
    +   '<div style="text-align:center;margin-bottom:12px">'
    +     '<div style="font-family:Syne,sans-serif;font-size:28px;font-weight:400;letter-spacing:-0.8px;line-height:1.1;color:#0D1B35">Innovate <span style="color:#0B8F68">+</span> Elevate</div>'
    +     '<div style="font-size:11px;font-weight:600;letter-spacing:1.5px;text-transform:uppercase;color:'+EM+';margin-top:10px">AI Readiness Results</div>'
    +     (orgName?'<div style="font-size:15px;font-weight:500;margin-top:6px">Prepared for '+escHtml(orgName)+'</div>':'')
    +     '<div style="font-size:12px;color:'+MUTED+';margin-top:'+(orgName?'2px':'6px')+'">'+dateStr()+'</div>'
    +   '</div>'
    +   '<div style="display:flex;align-items:center;justify-content:center;gap:28px;margin:6px 0 4px">'
    +     '<div style="text-align:center"><div style="font-family:Syne,sans-serif;font-size:54px;font-weight:500;letter-spacing:-2px;line-height:1;color:'+colorFor(avg)+'">'+avg+'%</div><div style="font-size:12px;color:'+MUTED+';margin-top:4px">Overall AI Readiness Score</div></div>'
    +     '<div>'+buildRadar(scores).replace('max-width:440px','max-width:300px').replace('width="100%"','width="300"')+'</div>'
    +   '</div>'
    +   '<div style="margin-top:8px">'+rows+'</div>'
    +   '<div style="display:flex;justify-content:space-between;margin-top:14px;font-size:11px;color:'+MUTED+'">'
    +     '<span><strong style="color:'+EM+'">60%+</strong> Ready for AI transformation</span>'
    +     '<span><strong style="color:#D97706">40–59%</strong> Building readiness</span>'
    +     '<span><strong style="color:#DC2626">Under 40%</strong> Foundation needed</span>'
    +   '</div>'
    +   '<div style="margin-top:18px;padding:12px 14px;border:0.5px solid rgba(11,143,104,.24);border-radius:14px;background:rgba(11,143,104,.055);text-align:center;line-height:1.45">'
    +     '<div style="font-family:Syne,sans-serif;font-size:17px;font-weight:400;letter-spacing:-0.3px;color:'+C+'">Ready to go deeper?</div>'
    +     '<div style="font-size:11px;font-weight:600;color:'+EM+';margin-top:4px">michelle@innovate-elevate.ai &middot; innovate-elevate.ai &middot; go.innovate-elevate.ai/meetwithmichelle</div>'
    +   '</div>'
    +   '<div style="margin-top:10px;padding-top:8px;border-top:0.5px solid rgba(13,27,53,.10);text-align:center;font-size:8.5px;color:#7A8698;line-height:1.35">'
    +     'Framework based on the AI Readiness Quotient (AI-RQ) by Scott A. Snyder, Wharton School, with agentic-era updates informed by the Wharton AI &amp; Analytics Initiative (The Age of Co-Intelligence, 2026). '
    +     'Data Management, Enablement &amp; Adoption, and AI Governance questions &copy; 2026 Innovate + Elevate Strategies, LLC.'
    +   '</div>'
    + '</div>';
}

async function downloadPDF(btn){
  const scores=dimensions.map((_,i)=>dimScore(i));
  const safeOrg = orgName ? '-'+orgName.trim().replace(/[^a-z0-9]+/gi,'_').replace(/^_|_$/g,'') : '';
  const filename = 'AI-Readiness-Results'+safeOrg+'.pdf';
  const el=document.createElement('div');
  el.innerHTML=buildReportHTML(scores);
  el.style.cssText='position:absolute;left:0;top:0;width:720px;background:#fff;z-index:2147483646;';
  const report=el.firstElementChild;
  if(report){ report.style.width='720px'; report.style.minHeight='1px'; }
  const cover=document.createElement('div');
  cover.style.cssText='position:fixed;inset:0;z-index:2147483647;background:#F8FAFC;display:flex;align-items:center;justify-content:center;font-family:Outfit,sans-serif;color:#0D1B35;font-weight:500;';
  cover.textContent='Preparing your branded PDF…';
  document.body.appendChild(el);
  document.body.appendChild(cover);
  const label = btn ? btn.innerHTML : '';
  if(btn){ btn.disabled=true; btn.innerHTML='Preparing PDF…'; }
  try{
    if(!window.html2pdf) throw new Error('lib missing');
    if(document.fonts && document.fonts.ready){ try{ await document.fonts.ready; }catch(e){} }
    await new Promise(resolve => requestAnimationFrame(resolve));
    el.style.height = Math.max(el.scrollHeight, report ? report.scrollHeight : 0, 1) + 'px';
    await html2pdf().set({
      margin:[18,18,18,18],
      filename:filename,
      image:{type:'jpeg',quality:0.98},
      html2canvas:{scale:2,useCORS:true,backgroundColor:'#ffffff'},
      jsPDF:{unit:'pt',format:'letter',orientation:'portrait'},
      pagebreak:{mode:['css','legacy']}
    }).from(report || el).save();
  }catch(e){
    el.remove();
    cover.remove();
    window.print(); // offline / library-blocked fallback
  }finally{
    if(el.isConnected) el.remove();
    if(cover.isConnected) cover.remove();
    if(btn){ btn.disabled=false; btn.innerHTML=label; }
  }
}

function go(p){
  if(p>=0&&p<=RESULTS){
    if(p===RESULTS&&!submitted){
      submitted=true;
      sendToFormspree(dimensions.map((_,i)=>dimScore(i)));
    }
    currentPage=p; render();
  }
}
function answer(i,q,v){ responses[i+'-'+q]=v; render(); }
function reset(){ responses={}; orgName=""; userName=""; userEmail=""; submitted=false; currentPage=0; render(); }

render();
</script>
